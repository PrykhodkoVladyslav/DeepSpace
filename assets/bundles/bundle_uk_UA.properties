hints.doc.nuclearGuidance = «Правила безпеки нейтронної промисловості»

hints.nuclearEnergyGuidance = [lightgray]Споруди, що використовують нейтронну енергію, працюють за особливою енергетичною системою. Детальний опис принципів роботи та правил експлуатації наведено в документі [accent]«Правила безпеки нейтронної промисловості»[lightgray].

hints.spliceStructure-0 = [lightgray]Деякі споруди можуть з'єднуватися з сумісними спорудами, розташованими поруч. Після успішного [accent]«зрощення»[lightgray] їхні межі об'єднуються, і вони виглядають як єдина конструкція. Деякі споруди мають особливі схеми з'єднання, однак у більшості випадків достатньо розмістити дві сумісні споруди [accent]одна навпроти одної[lightgray], щоб вони автоматично з'єдналися.
hints.spliceStructure-1 = [lightgray]З'єднані споруди отримують додаткові властивості, описані в розділі [accent]«Детальна інформація»[lightgray] кожної споруди. Водночас такі конструкції мають [accent]обмеження максимального розміру[lightgray]. Якщо його перевищити, конструкція може розділитися або стати недійсною — залежно від типу споруди.\n[gray]Ця підказка не має умов завершення. Якщо механіка вам уже зрозуміла, її можна пропустити вручну.

hints.matrixCorePlaced-0 = [accent]Ядро матричної мережі[lightgray] є центральним вузлом будь-якої Матричної мережі. Кожна мережа може містити [accent]лише одне[lightgray] Ядро.\nПісля його встановлення з'єднайте інші пристрої за допомогою [accent]Матричних мостів[lightgray]. Для роботи мережі необхідно щонайменше одне Ядро, з'єднане з [accent]дійсним енергетичним менеджером[lightgray] через Матричні мости.
hints.matrixCorePlaced-1 = [lightgray]Як показано в прикладі, під'єднайте [accent]Енергетичний менеджер[lightgray] до Ядра за допомогою Матричних мостів, а потім забезпечте його живленням через [accent]Енергетичний інтерфейс[lightgray].

hints.matrixUsageTip-0 = [lightgray]Матрична мережа може об'єднувати велику кількість різноманітних пристроїв. Кожен підключений пристрій споживає [accent]топологічну місткість[lightgray]. Якщо її ліміт буде вичерпано, підключення нових пристроїв зробить мережу недійсною.\nКрім того, більшість пристроїв надсилають запити до Ядра. [accent]Обчислювальна потужність[lightgray] Ядра обмежує кількість запитів, які мережа здатна обробляти одночасно.
hints.matrixUsageTip-1 = [lightgray]Максимальну [accent]топологічну місткість[lightgray] і [accent]обчислювальну потужність[lightgray] мережі можна збільшити, встановивши модулі розширення навколо Ядра, як показано в прикладі.\n[gray]Ця підказка не має умов завершення. Якщо механіка вам уже зрозуміла, її можна пропустити вручну.

hints.matrixGridPlaced-0 = [accent]Матрична сітка[lightgray] — це найефективніша [accent]система керування логістичними входами й виходами[lightgray] у Матричній мережі. З'єднуючи рамки сітки між собою, можна створити [accent]замкнену область[lightgray], у якій налаштовуються точки введення/виведення ресурсів і сховища.
hints.matrixGridPlaced-1 = [lightgray]Щоб побудувати Матричну сітку, розмістіть кілька [accent]рамок сітки[lightgray] та під'єднайте кожну з них безпосередньо до [accent]контролера сітки[lightgray], утворивши замкнений контур, як показано в прикладі.\nКількість рамок, які можна під'єднати до кожної сторони, залежить від використовуваного Контролера сітки. Базова модель підтримує до 8 з'єднань.

hints.matrixGridActivating-0 = [lightgray]Після створення Матрична сітка може автоматично керувати розподілом ресурсів, налаштовуючи [accent]сумісні сховища[lightgray] та [accent]точки введення/виведення[lightgray], розташовані всередині її замкненої області.
hints.matrixGridActivating-1 = [lightgray]Після успішної активації всі сумісні сховища й точки введення/виведення всередині області стануть доступними для налаштування. Наприклад, розмістіть [accent]Універсальний порт введення/виведення[lightgray] всередині сітки, виберіть [accent]Контролер сітки[lightgray], а потім натисніть на порт, щоб відкрити панель його налаштування.\nЦей самий спосіб застосовується й до всіх сумісних сховищ у межах області, зокрема Ядра, Сховищ, Сейфів та інших контейнерів.
hints.matrixGridActivating-2 = [lightgray]Після відкриття панелі використовуйте її елементи керування для налаштування параметрів введення та виведення. Натисніть [accent]«Підтвердити»[], щоб застосувати зміни. Якщо не вибрано жодного ресурсу, поточну конфігурацію буде очищено.\nДокладніший опис цієї панелі доступний після натискання кнопки [accent]«i»[].
