hints.doc.nuclearGuidance = "Neutron Industry Safety Regulations"

hints.nuclearEnergyGuidance = [lightgray]Facilities that use Neutron Energy operate under a unique power system. For detailed explanations and operating guidelines, please refer to [accent]"Neutron Industry Safety Regulations"[lightgray].

hints.spliceStructure-0 = [lightgray]Some structures can connect with compatible structures placed nearby. When they successfully [accent]"splice"[lightgray] together, their edges will merge, making them appear as a single unified structure. Some buildings have unique connection patterns, but in most cases two compatible structures placed [accent]face-to-face[lightgray] will automatically form a connected structure.
hints.spliceStructure-1 = [lightgray]Connected structures gain additional properties, which are described in each building's [accent]Detailed Information[lightgray]. Keep in mind that connected structures have a [accent]maximum structure size[lightgray]. Exceeding this limit may cause the structure to split apart or become invalid, depending on the building.\n[gray]This tutorial has no completion objective. If you already understand this mechanic, you may skip it manually.

hints.matrixCorePlaced-0 = [accent]The Matrix Core Server[lightgray] is the central component of every Matrix Network. Each Matrix Network can contain [accent]one and only one[lightgray] Core Server.\nAfter placing a Core Server, connect the various network devices using [accent]Matrix Bridges[lightgray]. A functional Matrix Network requires at minimum one Core Server connected to a [accent]valid Energy Manager[lightgray] through Matrix Bridges.
hints.matrixCorePlaced-1 = [lightgray]As demonstrated, connect an [accent]Energy Manager[lightgray] to the Core Server using Matrix Bridges, then provide power to the Energy Manager through a [accent]Power Interface[lightgray].

hints.matrixUsageTip-0 = [lightgray]A Matrix Network can connect many different devices. Every connected device consumes [accent]Topology Capacity[lightgray]. Once the topology limit is reached, connecting additional devices will invalidate the network.\nIn addition, most devices submit requests to the Core Server. The [accent]Computing Power[lightgray] of the Matrix Core Server is limited, determining how many task requests the network can process simultaneously.
hints.matrixUsageTip-1 = [lightgray]You can increase both the network's [accent]maximum Topology Capacity[lightgray] and [accent]Computing Power[lightgray] by installing expansion components around the Core Server, as shown in the demonstration.\n[gray]This tutorial has no completion objective. If you already understand this mechanic, you may skip it manually.

hints.matrixGridPlaced-0 = [accent]The Matrix Grid[lightgray] is the most efficient [accent]logistics I/O management system[lightgray] within a Matrix Network. By connecting Grid Frames together, it forms a [accent]closed region[lightgray] where network I/O points and storage containers can be configured.
hints.matrixGridPlaced-1 = [lightgray]To build a functional Matrix Grid, place several [accent]Grid Frames[lightgray] and connect each of them directly to the Grid Controller, forming a closed region similar to the example shown.\nThe number of Grid Frames that can connect to each edge depends on the [accent]Grid Controller[lightgray] being used. The basic controller supports up to 8 connections.

hints.matrixGridActivating-0 = [lightgray]Once established, a Matrix Grid can intelligently distribute resources by configuring the [accent]valid storage containers[lightgray] and [accent]I/O ports[lightgray] located within its enclosed area.
hints.matrixGridActivating-1 = [lightgray]After the Matrix Grid has been successfully established, all valid containers and I/O ports inside the enclosed area become configurable. For example, place a [accent]Universal I/O Port[lightgray] inside the grid, select the [accent]Grid Controller[lightgray], then click the I/O Port to open its configuration panel.\nThe same method also applies to valid storage structures within the area, such as the Core, Vaults, and other containers.
hints.matrixGridActivating-2 = [lightgray]Once the configuration panel is open, use its controls to configure the I/O settings. Click [accent]"Confirm"[] to apply a configuration. If no items are configured, the existing configuration will be cleared and removed.\nFor more information about this panel, click the [accent]"i"[] button to open the help page.
